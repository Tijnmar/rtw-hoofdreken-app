<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RWT Hoofdreken App 1.1</title><style>*{box-sizing:border-box}body{margin:0;background:#f0f6fa;color:#182b39;font:16px system-ui,sans-serif}header{background:#e30613;color:white;padding:24px max(5%,calc((100% - 760px)/2));}h1{font-size:clamp(24px,4vw,36px);margin:8px 0}main{max-width:760px;margin:32px auto;padding:0 16px}.panel{background:white;border-radius:20px;padding:28px;box-shadow:0 8px 30px #16384c12}button,input,select{font:inherit;padding:13px;border:1px solid #b9cbd5;border-radius:10px}button{cursor:pointer;background:#e30613;color:white;border:0;font-weight:650}button.secondary{background:#e4f0f7;color:#183a50}label{display:block;margin:18px 0 8px;font-weight:600}select,input[type=text]{width:100%}input[type=checkbox]{accent-color:#e30613}footer{text-align:center;color:#587080;padding:24px;font-size:13px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.question{font-size:clamp(26px,5vw,42px);margin:32px 0;font-weight:650}progress{width:100%;accent-color:#e30613}article{border-top:1px solid #dce5eb;padding:14px 0}.muted{color:#587080}.good{color:#167447}.bad{color:#b91c1c}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}</style></head><body><header><div>Wiskunde · Pabo</div><h1>RWT Hoofdreken App 1.1</h1><div>Groei in je (hoofd)rekenvaardigheden</div></header><main><section class="panel" id="app"></section></main><footer>Marnix Academie · made by MvdL</footer><script>
const app=document.querySelector('#app'), domains=['Hele getallen','Verhoudingen, procenten, breuken en decimale getallen','Meten en meetkunde'];let level=0,n=5,timed=true,qs=[],answers=[],i=0,deadline=0,interval;const r=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[r(0,a.length-1)],fmt=x=>String(x).replace('.',','),shuffle=a=>{for(let j=a.length-1;j>0;j--){let k=r(0,j);[a[j],a[k]]=[a[k],a[j]]}return a};
function make(d,l){let a=r(12,80+80*l),b=r(3,9+3*l),c=r(2,9),k=10**(l+1),p=pick([5,10,12.5,15,20,25,30,40,50,75]),v=r(2,30)*80;let q=(text,ans,tip)=>({d,text,ans,tip});if(d===0)return pick([q(`${a*k-1} + ${b*k+c}`, (a+b)*k+c-1,`Tel eerst ${b*k+c+1} op en trek daarna 1 af (compenseren).`),q(`${a*k+c} − ${b*k-1}`,(a-b)*k+c+1,`Trek ${b*k} af en tel 1 terug.`),q(`${a} × ${10*b-1}`,a*(10*b-1),`Gebruik ${a} × ${10*b} − ${a} (distributieve eigenschap).`),q(`${a*b*c} : ${b*c}`,a,`Deel achtereenvolgens door ${b} en ${c}.`),q(`${a} + ${b} × ${c} − ${a+1}`,b*c-1,`Vermenigvuldig eerst; combineer daarna de overige termen.`),q(`${a} × 25`,a*25,`Vermenigvuldig met 100 en deel door 4.`),q(`−${a} + ${b} × ${c}`,b*c-a,`Vermenigvuldig eerst en tel daarna op.`),q(`Gemiddelde van ${a-c}, ${a}, ${a+c+3}`,a+1,`Gebruik ${a} als referentie; de afwijkingen tellen op tot 3.`)]);if(d===1)return pick([q(`${fmt(p)}% van ${v}`,p*v/100,`Splits het percentage in handige delen, bijvoorbeeld 10%, 5% of 25%.`),q(`€ ${v} met ${fmt(p)}% korting. Nieuwe prijs in euro?`,v*(100-p)/100,`Bereken het kortingsbedrag en trek dit af.`),q(`${a}/${b} van ${b*c*10}`,a*c*10,`Deel eerst door ${b}, vermenigvuldig daarna met ${a}.`),q(`${fmt(a/10)} × ${fmt(b/10)}`,a*b/100,`Reken met gehele getallen en plaats de komma terug.`),q(`${fmt(a*b/10)} : ${fmt(b/10)}`,a,`Vermenigvuldig beide getallen met 10.`),q(`${b} stuks kosten € ${b*c}. Wat kosten ${a} stuks in euro?`,a*c,`Bereken eerst de prijs per stuk: € ${c}.`)]);return pick([q(`${fmt(a/10)} m² = hoeveel cm²?`,a*1000,`1 m² = 10.000 cm².`),q(`${fmt(a/10)} liter = hoeveel ml?`,a*100,`1 liter = 1000 ml.`),q(`Een rechthoek van ${a} cm bij ${b} cm. Oppervlakte in cm²?`,a*b,`Lengte × breedte; splits een factor indien nodig.`),q(`Een auto rijdt ${a*3} km in 45 minuten. Hoeveel km/u?`,a*4,`45 minuten is driekwart uur; deel door 3 en vermenigvuldig met 4.`),q(`Een balk van ${a} cm bij ${b} cm bij ${c} cm. Inhoud in cm³?`,a*b*c,`Groepeer de factoren handig.`)])}
// Bank van 1000 unieke vragen per niveau.
const banks=Array.from({length:3},(_,l)=>{let bank=[];for(let d=0;d<3;d++){let seen=new Set(),target=[500,330,170][d];while(seen.size<target){let x=make(d,l);if(!seen.has(x.text)){seen.add(x.text);bank.push(x)}}}return bank});
function home(){clearInterval(interval);app.innerHTML=`<h2>Start een oefenronde</h2><label for="level">Niveau</label><select id="level"><option>Basis</option><option>Gevorderd</option><option>Uitdagend</option></select><label for="length">Oefenronde</label><select id="length"><option value="5">5 opgaven · 5 minuten</option><option value="10">10 opgaven · 10 minuten</option><option value="15">15 opgaven · 15 minuten</option></select><label><input id="timed" type="checkbox" checked> Timer gebruiken</label><p class="muted">Oefen zonder rekenmachine. De opgaven zijn geen officiële RWT-toetsvragen.</p><button id="start">Start oefenen</button>`;app.querySelector('#start').onclick=()=>{level=app.querySelector('#level').selectedIndex;n=+app.querySelector('#length').value;timed=app.querySelector('#timed').checked;let counts={5:[3,1,1],10:[5,3,2],15:[8,5,2]}[n];qs=shuffle(counts.flatMap((count,d)=>shuffle(banks[level].filter(x=>x.d===d)).slice(0,count)));answers=[];i=0;deadline=Date.now()+n*60000;show();if(timed)interval=setInterval(tick,200)}}
function tick(){let left=Math.max(0,Math.ceil((deadline-Date.now())/1000));let el=document.querySelector('#timer');if(el)el.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;if(!left){save();finish()}}
function save(){let el=document.querySelector('#answer');if(el)answers[i]=el.value.trim()}
function show(){app.innerHTML=`<div class="top"><strong>Opgave ${i+1} van ${n}</strong><strong id="timer"></strong></div><progress max="${n}" value="${i}"></progress><p class="muted">${domains[qs[i].d]}</p><div class="question">${qs[i].text}</div><form id="form"><label for="answer">Jouw antwoord</label><input id="answer" type="text" inputmode="decimal" autocomplete="off"><div class="actions"><button>${i===n-1?'Nakijken':'Volgende'}</button><button type="button" class="secondary" id="stop">Afronden</button></div></form>`;document.querySelector('#form').onsubmit=e=>{e.preventDefault();save();if(++i===n)finish();else show()};document.querySelector('#stop').onclick=()=>{save();finish()};document.querySelector('#answer').focus();if(timed)tick()}
function correct(x,j){let s=(answers[j]||'').replace(',','.');return s!==''&&Number.isFinite(Number(s))&&Math.abs(Number(s)-x.ans)<1e-7}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function finish(){clearInterval(interval);let score=qs.filter(correct).length;let stats=domains.map((name,d)=>{let total=qs.filter(x=>x.d===d).length,ok=qs.filter((x,j)=>x.d===d&&correct(x,j)).length;return{name,total,ok,d}});let weak=[...stats].sort((a,b)=>a.ok/a.total-b.ok/b.total)[0];let mistakes=qs.filter((x,j)=>!correct(x,j)&&x.d===weak.d);app.innerHTML=`<h2>Jouw resultaat</h2><h1>${score} / ${n} goed</h1><progress max="${n}" value="${score}"></progress><h3>Terugkoppeling per domein</h3>${stats.map(s=>`<article><strong>${s.name}</strong><div>${s.ok} van ${s.total} goed</div></article>`).join('')}<h3>Persoonlijk oefenadvies</h3><p>${score===n?'Alles goed! Probeer een hoger niveau of een langere ronde.':`Oefen vooral ${weak.name.toLowerCase()}. ${mistakes[0]?.tip||''} Herhaal dit domein in een volgende ronde.`}</p><h3>Uitwerkingen</h3>${qs.map((x,j)=>`<article><strong class="${correct(x,j)?'good':'bad'}">${correct(x,j)?'✓':'✗'} ${x.text}</strong><p>Jouw antwoord: ${esc(answers[j]||'Niet ingevuld')} · Goed: ${fmt(x.ans)}</p><div>${x.tip}</div></article>`).join('')}<button id="again">Nieuwe oefenronde</button>`;document.querySelector('#again').onclick=home}home();
</script></body></html>
