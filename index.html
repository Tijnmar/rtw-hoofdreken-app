<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RWT Hoofdreken App</title><style>*{box-sizing:border-box}body{margin:0;background:#f0f6fa;color:#182b39;font:16px system-ui,sans-serif}header{background:#e30613;color:white;padding:24px max(5%,calc((100% - 760px)/2));}h1{font-size:clamp(24px,4vw,36px);margin:8px 0}main{max-width:760px;margin:32px auto;padding:0 16px}.panel{background:white;border-radius:20px;padding:28px;box-shadow:0 8px 30px #16384c12}button,input,select{font:inherit;padding:13px;border:1px solid #b9cbd5;border-radius:10px}button{cursor:pointer;background:#e30613;color:white;border:0;font-weight:650}button.secondary{background:#e4f0f7;color:#183a50}label{display:block;margin:18px 0 8px;font-weight:600}select,input[type=text]{width:100%}input[type=checkbox]{accent-color:#e30613}footer{text-align:center;color:#587080;padding:24px;font-size:13px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.question{font-size:clamp(26px,5vw,42px);margin:32px 0;font-weight:650}progress{width:100%;accent-color:#e30613}article{border-top:1px solid #dce5eb;padding:14px 0}.muted{color:#587080}.good{color:#167447}.bad{color:#b91c1c}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.choice{background:#e4f0f7;color:#183a50;min-height:65px;border:2px solid transparent}.choice[aria-pressed=true]{background:#e30613;color:white;border-color:#a8000a}.choice small{display:block;font-weight:400}.start{width:100%;margin-top:12px}@media(max-width:420px){.panel{padding:16px}.choice{padding:8px;font-size:14px}}header{position:relative;overflow:hidden;background:linear-gradient(115deg,#bd0010,#e30613 65%,#f33d47);padding-top:38px;padding-bottom:38px}header>div,header>h1{position:relative;z-index:1}header .art{position:absolute;right:max(3%,calc((100% - 1000px)/2));top:10px;width:220px;height:155px;opacity:.26;z-index:0}main{max-width:820px;margin: -12px auto 24px;position:relative}.panel{padding:32px;border:1px solid #e2eaf0;box-shadow:0 14px 45px #16384c18}h2{margin-top:0;font-size:25px}h3{margin-top:28px}.choice{min-height:104px;border:1px solid #c9e1ee;background:#f0f8fc;transition:transform .15s,box-shadow .15s}.choice:hover{transform:translateY(-2px);box-shadow:0 5px 15px #16384c15}.choice[aria-pressed=true]{box-shadow:0 4px 12px #e3061330}.choice .ico{display:block;margin:0 auto 8px;width:30px;height:30px}.choice .num{display:block;font-size:28px;line-height:1.1}.start{padding:17px;font-size:17px}.section-icon{display:inline-flex;vertical-align:middle;margin-right:8px;color:#e30613}.section-icon svg{width:22px;height:22px}.question{background:#f0f8fc;border-radius:16px;padding:28px 20px;text-align:center;border:1px solid #d9eaf3}progress{height:12px;border:0;border-radius:10px;overflow:hidden}article{border-top:0;background:#f5f9fc;border-radius:12px;margin:8px 0;padding:14px 16px}#timer{background:#e4f0f7;border-radius:30px;padding:6px 12px;font-variant-numeric:tabular-nums}#timer:empty{display:none}button:focus-visible,input:focus-visible{outline:3px solid #2788b9;outline-offset:3px}@media(max-width:500px){header .art{width:130px;opacity:.15}.panel{padding:18px}.choice{min-height:90px}.question{padding:20px 12px}}</style></head><body><header><svg class="art" viewBox="0 0 220 155" fill="none" stroke="white" stroke-width="3" aria-hidden="true"><rect x="12" y="15" width="75" height="100" rx="12" transform="rotate(-12 50 65)"/><path d="M25 36h48v20H25z M30 72h9m-4-5v10m20-5h9m-34 20h9m16-4 9 9m0-9-9 9"/><circle cx="155" cy="70" r="38"/><path d="M155 32v38h38M155 70l-27 27M110 130h90M125 120v20m20-15v10m20-15v20m20-15v10"/></svg><div>Wiskunde · Pabo</div><h1>RWT Hoofdreken App</h1><div>Groei in je (hoofd)rekenvaardigheden</div></header><main><section class="panel" id="app"></section></main><footer>Marnix Academie · made by MvdL</footer><script>
const app=document.querySelector('#app'), domains=['Hele getallen','Verhoudingen, procenten, breuken en decimale getallen','Meten en meetkunde'];let level=0,n=5,timed=true,qs=[],answers=[],i=0,deadline=0,interval;const r=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[r(0,a.length-1)],fmt=x=>String(x).replace('.',','),shuffle=a=>{for(let j=a.length-1;j>0;j--){let k=r(0,j);[a[j],a[k]]=[a[k],a[j]]}return a};
function make(d,l){const q=(text,ans,strategy='')=>({d,text,ans,strategy});let x=r(12, l===0?59:l===1?199:499), y=r(11,l===0?89:l===1?399:999), z=r(2,9), k=[10,100,1000][l], m=r(1,l===0?9:19), t=r(1,9), v=r(2,100), base=k*m;
if(d===0){let f=pick([[5,2],[25,4],[125,8]].slice(0,l+1)), round=pick(l===0?[10,20]:l===1?[20,50,100]:[100,200,1000]), h=pick(l===0?[2,5]:l===1?[5,15,25]:[25,50,125]);return pick([
q(`${base-z} + ${y} + ${z}`,base+y,'Commutatieve eigenschap'),q(`${f[0]} × ${x} × ${f[1]}`,f[0]*x*f[1],'Associatieve eigenschap'),q(`${round-1} × ${x}`,(round-1)*x,'Distributieve eigenschap'),q(`${round+1} × ${x}`,(round+1)*x,'Distributieve eigenschap'),q(`${base+z} − ${k*t-1}`,base+z-k*t+1,'Compenseren'),q(`${base-1} + ${y}`,base-1+y,'Compenseren'),q(`${h*v} : ${h}`,v,'Getalrelaties'),q(`${f[0]} × ${2*v}`,f[0]*2*v,'Verdubbelen en halveren'),q(`${x} × ${z} + ${x} × ${10-z}`,10*x,'Distributieve eigenschap'),q(`${x} + ${y} − ${x-1}`,y+1,'Getalrelaties')]);}
if(d===1){let [num,den]=pick(l===0?[[1,2],[1,4],[3,4],[1,5]]:l===1?[[3,8],[5,8],[1,8],[3,5],[7,10]]:[[3,8],[7,12],[11,16],[7,8],[9,20]]), p=pick(l===0?[10,20,25,50,75]:l===1?[12.5,15,37.5,75]:[6.25,18.75,62.5,87.5]), u=pick(l===0?[0.5,0.25]:l===1?[2.5,0.125,1.5]:[0.0625,1.25,3.75]), w=v*16;return pick([q(`${num}/${den} van ${den*v}`,num*v,'Getalrelaties'),q(`${fmt(p)}% van ${w*10}`,p*w/10,'Getalrelaties'),q(`${fmt(u)} × ${w}`,u*w,'Getalrelaties'),q(`${fmt(x/10)} + ${fmt(y/10)} + ${fmt((10-x%10)/10)}`,(x+y+10-x%10)/10,'Commutatieve eigenschap'),q(`${z} stuks kosten € ${z*v}. Wat kosten ${z*2} stuks in euro?`,2*z*v,'Verhoudingsdenken'),q(`${fmt(v/10)} : ${fmt(0.5)}`,v/5,'Verdubbelen en halveren')]);}
let f=pick(l===0?[2,5,10]:l===1?[4,25,50]:[8,125,250]), g=pick(l===0?[2,5]:[4,8,20]);return pick([q(`${fmt(x/10)} m = hoeveel cm?`,x*10,'Getalrelaties'),q(`${fmt(y/10)} liter = hoeveel ml?`,y*100,'Getalrelaties'),q(`Een rechthoek van ${f} cm bij ${g*v} cm. Oppervlakte in cm²?`,f*g*v,'Associatieve eigenschap'),q(`Je rijdt ${3*v} km in 45 minuten. Hoeveel km/u?`,4*v,'Verhoudingsdenken'),q(`Een balk van ${f} cm bij ${g} cm bij ${v} cm. Inhoud in cm³?`,f*g*v,'Associatieve eigenschap'),q(`${fmt(y/10)} kg = hoeveel gram?`,y*100,'Getalrelaties')]);}
// Bank van 1000 unieke vragen per niveau.
const banks=Array.from({length:3},(_,l)=>{let bank=[];for(let d=0;d<3;d++){let seen=new Set(),target=[500,330,170][d];while(seen.size<target){let x=make(d,l);if(!seen.has(x.text)){seen.add(x.text);bank.push(x)}}}return bank});
const icon=(path)=>`<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${path}</svg>`;const levelIcons=[icon('<path d="M4 20h4v-6H4z M10 20h4v-10h-4z M16 20h4v-14h-4z" opacity=".35"/><path d="M4 20h4v-6H4z"/>'),icon('<path d="M4 20h4v-6H4z M10 20h4v-10h-4z M16 20h4v-14h-4z"/><path d="M16 20h4v-14h-4z" opacity=".35"/>'),icon('<path d="M4 20h4v-6H4z M10 20h4v-10h-4z M16 20h4v-14h-4z M4 9l6-5 4 2 6-4"/>')];const si=p=>`<span class="section-icon">${icon(p)}</span>`;function home(){clearInterval(interval);app.innerHTML=`<h2>Start een oefenronde</h2><label>${si('<path d="M4 19h16M6 15l5-5 4 3 5-8"/>')}Kies je niveau</label><div class="choices" id="levels">${['Basis','Gevorderd','Uitdagend'].map((x,j)=>`<button class="choice" data-value="${j}" aria-pressed="${level===j}">${levelIcons[j]}${x}</button>`).join('')}</div><label>${si('<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/>')}Kies het aantal opgaven</label><div class="choices" id="lengths">${[5,10,15].map(x=>`<button class="choice" data-value="${x}" aria-pressed="${n===x}"><span class="num">${x}</span>opgaven<small>${x} minuten</small></button>`).join('')}</div><label><input id="timed" type="checkbox" ${timed?"checked":""}> Timer gebruiken</label><p class="muted">Oefen zonder rekenmachine. De opgaven zijn geen officiële RWT-toetsvragen.</p><button id="start" class="start">Start oefenen</button>`;for(const [id,set] of [['levels',v=>level=v],['lengths',v=>n=v]]){let group=app.querySelector('#'+id);group.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{set(+btn.dataset.value);group.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===btn)))})}app.querySelector('#start').onclick=()=>{timed=app.querySelector('#timed').checked;let counts={5:[3,1,1],10:[5,3,2],15:[8,5,2]}[n];let bank=banks[level], required=['Commutatieve eigenschap','Associatieve eigenschap','Distributieve eigenschap'].map(t=>pick(bank.filter(x=>x.d===0&&x.strategy===t)));qs=shuffle([...required,...counts.flatMap((count,d)=>shuffle(bank.filter(x=>x.d===d&&!required.includes(x))).slice(0,count-(d===0?3:0)))]);answers=[];i=0;deadline=Date.now()+n*60000;show();if(timed)interval=setInterval(tick,200)}}
function tick(){let left=Math.max(0,Math.ceil((deadline-Date.now())/1000));let el=document.querySelector('#timer');if(el)el.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;if(!left){save();finish()}}
function save(){let el=document.querySelector('#answer');if(el)answers[i]=el.value.trim()}
function show(){app.innerHTML=`<div class="top"><strong>Opgave ${i+1} van ${n}</strong><strong id="timer"></strong></div><progress max="${n}" value="${i}"></progress><p class="muted">${domains[qs[i].d]}</p><div class="question">${qs[i].text}</div><form id="form"><label for="answer">Jouw antwoord</label><input id="answer" type="text" inputmode="decimal" autocomplete="off"><div class="actions"><button>${i===n-1?'Nakijken':'Volgende'}</button><button type="button" class="secondary" id="stop">Afronden</button></div></form>`;document.querySelector('#form').onsubmit=e=>{e.preventDefault();save();if(++i===n)finish();else show()};document.querySelector('#stop').onclick=()=>{save();finish()};document.querySelector('#answer').focus();if(timed)tick()}
function correct(x,j){let s=(answers[j]||'').replace(',','.');return s!==''&&Number.isFinite(Number(s))&&Math.abs(Number(s)-x.ans)<1e-7}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function finish(){clearInterval(interval);let score=qs.filter(correct).length;let stats=domains.map((name,d)=>{let total=qs.filter(x=>x.d===d).length,ok=qs.filter((x,j)=>x.d===d&&correct(x,j)).length;return{name,total,ok,d}});let weak=[...stats].sort((a,b)=>a.ok/a.total-b.ok/b.total)[0];let mistakes=qs.filter((x,j)=>!correct(x,j)&&x.d===weak.d);app.innerHTML=`<h2>${si('<path d="M8 3h8v8a4 4 0 0 1-8 0zM8 5H4v3a4 4 0 0 0 4 4m8-7h4v3a4 4 0 0 1-4 4M12 15v5m-5 1h10"/>')}Jouw resultaat</h2><h1>${score} / ${n} goed</h1><progress max="${n}" value="${score}"></progress><h3>Terugkoppeling per domein</h3>${stats.map(s=>`<article><strong>${s.name}</strong><div>${s.ok} van ${s.total} goed</div></article>`).join('')}<h3>Persoonlijk oefenadvies</h3><p>${score===n?'Alles goed! Probeer een hoger niveau of een langere ronde.':`Oefen vooral ${weak.name.toLowerCase()}. ${mistakes.some(x=>x.strategy)?'Besteed extra aandacht aan '+[...new Set(mistakes.map(x=>x.strategy).filter(Boolean))].join(', ')+'.':''} Herhaal dit domein in een volgende ronde.`}</p><h3>Rekenstrategieën</h3>${[...new Set(qs.map(x=>x.strategy).filter(Boolean))].map(t=>{let items=qs.map((x,j)=>({x,j})).filter(o=>o.x.strategy===t);return `<article><strong>${t}</strong><div>${items.filter(o=>correct(o.x,o.j)).length} van ${items.length} goed</div></article>`}).join('')}<h3>Antwoorden</h3>${qs.map((x,j)=>`<article><strong class="${correct(x,j)?'good':'bad'}">${correct(x,j)?'✓':'✗'} ${x.text}</strong><p>Jouw antwoord: ${esc(answers[j]||'Niet ingevuld')} · Goed: ${fmt(x.ans)}</p></article>`).join('')}<button id="again">Nieuwe oefenronde</button>`;document.querySelector('#again').onclick=home}home();
</script></body></html>
